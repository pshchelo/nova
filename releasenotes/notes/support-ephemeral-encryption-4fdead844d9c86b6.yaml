features:
  - |
    The libvirt driver with the qcow2 image backend now supports LUKS
    encryption of ephemeral/local disks including root, ephemeral, and swap
    disks. Currently only disks created from unencrypted source images are
    supported. This means that backing files are not encrypted.

    The following server actions are currently supported:

    * create/delete
    * start/stop
    * reboot soft/hard
    * pause/unpause
    * suspend/resume
    * console create/show
    * interface attach/detach
    * volume attach/detach
    * diagnostics show
    * resize
    * cold migration

    .. note::

      Cross cell resize of servers specifying ephemeral encryption is not
      supported yet as it requires support of snapshots.
